# =============================================================================
# Coolify deployment. Assumes Coolify's built-in Traefik proxy owns the
# domain/TLS — no separate reverse-proxy/tunnel config needed.
# Rename the service key below (currently "app") to your project's name;
# it's referenced by src/pages/api/contact.ts's mailer if you use the
# deploy-paas skill's config-driven deploy flow.
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOST: '0.0.0.0'
      PORT: '4321'
      NODE_ENV: 'production'
      MS_TENANT_ID: ${MS_TENANT_ID}
      MS_CLIENT_ID: ${MS_CLIENT_ID}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET}
      CONTACT_EMAIL: ${CONTACT_EMAIL}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4321/api/health').then((r)=>process.exit(r.ok ? 0 : 1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
